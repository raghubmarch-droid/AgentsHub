<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Testing – Agents Hub | Create Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-deep:#0a0e1a; --bg-card:#111827; --bg-input:#1a2236;
    --accent:#00e5ff; --accent-dim:#00b8d0; --accent-glow:rgba(0,229,255,.25);
    --text-primary:#eef2f7; --text-muted:#6b7a99; --danger:#ff5c5c;
    --border:rgba(0,229,255,.15);
  }
  html, body { height:100%; width:100%; background:var(--bg-deep); color:var(--text-primary);
    font-family:'Rajdhani',sans-serif; overflow:hidden; }
  .bg-grid { position:fixed; inset:0; z-index:0;
    background-image:linear-gradient(rgba(0,229,255,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,229,255,.06) 1px,transparent 1px);
    background-size:60px 60px; animation:gridShift 40s linear infinite; }
  @keyframes gridShift { to { background-position:60px 60px; } }
  .orb { position:fixed; border-radius:50%; filter:blur(70px); opacity:.35; z-index:0;
    animation:orbFloat 12s ease-in-out infinite alternate; }
  .orb-1 { width:360px;height:360px;background:#00e5ff;top:-120px;left:-100px; }
  .orb-2 { width:280px;height:280px;background:#7c4dff;bottom:-80px;right:-80px;animation-delay:3s; }
  @keyframes orbFloat { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(40px,-30px) scale(1.08)} }
  .page-wrap { position:relative;z-index:1;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px; }
  .card { width:100%;max-width:440px;background:var(--bg-card);border:1px solid var(--border);
    border-radius:20px;padding:44px 40px 36px;box-shadow:0 8px 40px rgba(0,0,0,.45),0 0 60px var(--accent-glow);backdrop-filter:blur(6px); }
  .brand { text-align:center;margin-bottom:28px; }
  .brand-icon { display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;
    background:linear-gradient(135deg,var(--accent),#7c4dff);margin-bottom:12px;box-shadow:0 4px 20px var(--accent-glow); }
  .brand-icon svg { width:28px;height:28px; }
  .brand h1 { font-size:1.45rem;font-weight:700; }
  .brand h1 span { color:var(--accent); }
  .brand p { color:var(--text-muted);font-size:.88rem;margin-top:3px; }
  .form-group { margin-bottom:15px; }
  .form-group label { display:block;font-size:.78rem;font-weight:600;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.8px; }
  .input-wrap { position:relative; }
  .input-wrap .icon { position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-muted); }
  input[type="email"],input[type="password"],input[type="text"] {
    width:100%;height:46px;background:var(--bg-input);border:1px solid var(--border);border-radius:10px;
    color:var(--text-primary);font-family:'Share Tech Mono',monospace;font-size:.86rem;
    padding:0 14px 0 42px;transition:border-color .25s,box-shadow .25s;outline:none; }
  input:focus { border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow); }
  input::placeholder { color:var(--text-muted);opacity:.6; }
  .btn-reg { width:100%;height:48px;border:none;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:var(--bg-deep);
    font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:700;letter-spacing:1.2px;
    text-transform:uppercase;cursor:pointer;transition:box-shadow .25s,transform .15s;margin-top:6px; }
  .btn-reg:hover { box-shadow:0 4px 24px var(--accent-glow);transform:translateY(-1px); }
  .error-msg { background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.3);border-radius:8px;
    padding:10px 14px;margin-bottom:16px;color:var(--danger);font-size:.85rem;text-align:center; }
  .card-footer { text-align:center;margin-top:20px;font-size:.86rem;color:var(--text-muted); }
  .card-footer a { color:var(--accent);text-decoration:none;font-weight:600; }
  .card-footer a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div><div class="orb orb-2"></div>
  <div class="page-wrap">
    <div class="card">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1>Testing – <span>Agents Hub</span></h1>
        <p>Create your account to get started</p>
      </div>

      {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}

      <form method="POST" action="/register" autocomplete="off">
        <div class="form-group">
          <label>Full Name</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" name="name" placeholder="John Doe" required />
          </div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
            </svg>
            <input type="email" name="email" placeholder="you@example.com" required />
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" name="password" placeholder="••••••••" required />
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" name="confirm_password" placeholder="••••••••" required />
          </div>
        </div>
        <button type="submit" class="btn-reg">Create Account</button>
      </form>
      <div class="card-footer">Already have an account? <a href="/">Sign In</a></div>
    </div>
  </div>
</body>
</html>
